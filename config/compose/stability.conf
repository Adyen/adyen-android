// Classes the Compose compiler should treat as stable. Every entry is a promise, so only add a type whose instances
// never change after they are created. See CheckoutAndroidLibraryPlugin.configureComposeCompiler().

// A List is only a read-only view, so the compiler cannot prove one never changes. Ours are built fresh by the view
// state producers and nobody keeps a mutable handle to them. <*> keeps the element type in the stability check, and
// MutableList stays unstable on purpose.
kotlin.collections.List<*>
