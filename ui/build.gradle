plugins {
    alias libs.plugins.checkout.android.library
    alias libs.plugins.kotlin.compose
    alias libs.plugins.kotlin.parcelize
}

checkoutPublishing {
    id = "ui"
    name = "Adyen Checkout UI"
    description = "UI and styling foundation for Adyen Checkout."
}

android {
    // TODO - change to com.adyen.checkout.ui once we get rid of ui-core
    namespace 'com.adyen.checkout.test'

    buildFeatures {
        compose = true
    }
}

dependencies {
    implementation libs.androidx.constraintlayout.compose

    api platform(libs.compose.bom)
    api libs.androidx.appcompat
    api libs.compose.material
    api libs.compose.ui.graphics
    api libs.compose.ui.main
    api libs.compose.ui.tooling.preview

    debugApi libs.compose.ui.tooling

    // Tests
    testImplementation libs.bundles.junit

    // UI tests
    androidTestImplementation libs.compose.ui.test.junit4
    // Compose's ui-test-junit4 transitively pulls in an old espresso-core (3.5.0) that reflectively
    // calls the now-removed InputManager.getInstance(), crashing on API 36.1+ emulators. Pin the
    // version explicitly so Gradle's conflict resolution picks the fixed release instead.
    androidTestImplementation libs.espresso.core
    debugImplementation libs.compose.ui.test.manifest
}
