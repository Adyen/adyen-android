name: Update verification metadata

on:
  push:
    branches:
      - 'renovate/main-android.gradle.plugin'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-verification-metadata:
    name: Update verification metadata
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip update-verification-metadata]') }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.ADYEN_AUTOMATION_BOT_ACCESS_TOKEN }}

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Gradle update verification metadata
        # --refresh-dependencies is required: metadata files (BOM and parent poms) that are already in the module
        # metadata cache are not re-parsed, so they would not be recorded in the verification metadata.
        run: ./gradlew --write-verification-metadata sha256 resolveDependencies --refresh-dependencies

      - name: Commit
        env:
          USER_NAME: ${{ secrets.ADYEN_AUTOMATION_BOT_USER }}
          USER_EMAIL: ${{ secrets.ADYEN_AUTOMATION_BOT_NO_REPLY_EMAIL }}
        run: |
          git config user.name "$USER_NAME"
          git config user.email "$USER_EMAIL"
          git add .
          git diff-index --quiet HEAD || git commit -m "Update verification metadata
          
          [skip update-verification-metadata]"
          git push
