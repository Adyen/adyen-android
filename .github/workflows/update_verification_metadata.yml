name: Update verification metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-verification-metadata:
    name: Update verification metadata
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip update-verification-metadata]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.ADYEN_AUTOMATION_BOT_ACCESS_TOKEN }}

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Gradle update verification metadata
        # We have to run assembleDebug to make sure dynamic dependencies (aapt2) are resolved.
        run: ./gradlew --write-verification-metadata sha256 resolveDependencies assembleDebug

      - name: Commit
        env:
          USER_NAME: ${{ secrets.ADYEN_AUTOMATION_BOT_USER }}
          USER_EMAIL: ${{ secrets.ADYEN_AUTOMATION_BOT_NO_REPLY_EMAIL }}
        run: |
          git config user.name "$USER_NAME"
          git config user.email "$USER_EMAIL"
          git add .
          git diff-index --quiet HEAD || git commit -m "Update verification metadata
          
          [skip update-verification-metadata]"
          git push
