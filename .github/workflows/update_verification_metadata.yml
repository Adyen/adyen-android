name: Update verification metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build runs code from the updated dependencies, so it never gets the bot token. Only the commit job, which
  # does not run the build, can push.
  generate-verification-metadata:
    name: Generate verification metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Gradle update verification metadata
        # --refresh-dependencies is required: metadata files (BOM and parent poms) that are already in the module
        # metadata cache are not re-parsed, so they would not be recorded in the verification metadata.
        run: ./gradlew --write-verification-metadata sha256 resolveDependencies --refresh-dependencies

      - name: Upload verification metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

  commit-verification-metadata:
    name: Commit verification metadata
    needs: generate-verification-metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.ADYEN_AUTOMATION_BOT_ACCESS_TOKEN }}

      - name: Download verification metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verification-metadata
          path: gradle

      - name: Commit
        env:
          USER_NAME: ${{ secrets.ADYEN_AUTOMATION_BOT_USER }}
          USER_EMAIL: ${{ secrets.ADYEN_AUTOMATION_BOT_NO_REPLY_EMAIL }}
        run: |
          git config user.name "$USER_NAME"
          git config user.email "$USER_EMAIL"
          git add gradle/verification-metadata.xml
          git diff --cached --quiet || git commit -m "Update verification metadata"
          git push
